name: Build desktop installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS DMG
            os: macos-latest
            platform: mac
            artifact: macos-dmg
          - name: Windows NSIS+MSI
            os: windows-latest
            platform: win
            artifact: windows-installer

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout installer
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install zstd (macOS)
        if: runner.os == 'macOS'
        run: brew install zstd || true

      - name: Install zstd (Windows)
        if: runner.os == 'Windows'
        run: choco install zstd -y || true

      - name: Install electron-builder deps
        run: npm ci || npm install

      - name: Fetch workbench source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKBENCH_ASSET_TAG: workbench-src-v0.1.0
          WORKBENCH_ASSET_NAME: workbench-src.tar.zst
        run: bash scripts/ci-fetch-workbench.sh

      - name: Build workbench (pnpm install + build)
        env:
          FDEX_SRC_REPO: ${{ github.workspace }}/workbench-src
          FDEX_VENDOR: ${{ github.workspace }}/vendor
        run: bash scripts/ci-build-workbench.sh

      - name: Stage workbench + fetch Node runtime
        env:
          FDEX_SRC_REPO: ${{ github.workspace }}/workbench-src
          FDEX_VENDOR: ${{ github.workspace }}/vendor
        run: |
          if [[ "${{ matrix.platform }}" == "mac" ]]; then
            bash scripts/stage-workbench.sh mac
            # macos-latest is apple silicon
            bash scripts/fetch-node.sh darwin-arm64 active
          else
            bash scripts/stage-workbench.sh win
            bash scripts/fetch-node.sh win-x64 active
          fi

      - name: Electron Builder (macOS)
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac dmg zip --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Electron Builder (Windows)
        if: matrix.platform == 'win'
        run: npx electron-builder --win nsis msi --x64 --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FDE-X-Workbench-${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.msi
            dist/*.blockmap
          if-no-files-found: warn
          retention-days: 14
